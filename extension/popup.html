<!doctype html><html lang="en"><meta charset="utf-8"><title>HyperSolve</title>
<style>body{font:14px 'Segoe UI',sans-serif;width:300px;margin:0;padding:20px;color:#24293b;background:#f3f4f8}h1{font-size:20px;margin:0 0 5px}p{line-height:1.5;color:#606b82}button{font:inherit;border:1px solid #c2c9da;background:white;color:#24293b;border-radius:7px;padding:10px;text-align:left;cursor:pointer;width:100%;margin:4px 0}button:hover{background:#e9edfb}button:focus-visible{outline:2px solid #3759dc}#connect{background:#3759dc;color:white}label{display:block;margin:18px 0}#status{min-height:38px}small{color:#606b82}</style>
<h1>HyperSolve</h1><small>Your browser, managed from Windows.</small>
<p id="status" role="status">Checking connection…</p>
<label><input id="monitor" type="checkbox"> Detect quizzes automatically</label>
<button id="connect">Connect Windows manager</button><button id="rescan">Scan this tab again</button>
<button id="save_workspace">Save this window’s workspace</button><button id="restore_workspace">Restore saved workspace</button>
<p>Detection runs locally. You approve each quiz before scanning and sending questions to AI. Answers are never submitted automatically.</p>
<script src="popup.js"></script></html>
