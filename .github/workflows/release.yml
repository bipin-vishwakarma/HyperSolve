name: Build Windows desktop

on:
  push:
    branches: [main, 'codex/**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt pyinstaller
          choco install innosetup -y --no-progress
      - name: Validate release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $Expected = python -c "from hypersolve.__version__ import __version__; print('v' + __version__)"
          if ($Expected -ne '${{ github.ref_name }}') { throw 'Tag and app version differ' }
      - name: Test and build standalone installer
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: HyperSolve-Windows
          path: |
            dist_installer/*.exe
            dist_installer/latest.json
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist_installer/*.exe
            dist_installer/latest.json
          generate_release_notes: true
